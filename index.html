<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CineMax Pro | DARK WORLD</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #6366f1; --glass: rgba(255, 255, 255, 0.05); }
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #020617);
            color: white; font-family: 'Inter', sans-serif; margin: 0;
            overflow-x: hidden; background-attachment: fixed; user-select: none;
        }
        .glass { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .active-tab { background: var(--accent) !important; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); border: none !important; }
        .movie-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .movie-card:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(99, 102, 241, 0.95); padding: 12px 24px; border-radius: 20px; font-size: 10px; font-weight: 800; z-index: 2000; display: none; text-transform: uppercase; text-align: center; width: 85%; }
    </style>
</head>
<body class="pb-32">

    <div id="toast">Message</div>

    <header class="fixed top-0 w-full z-50 px-6 py-4 glass border-none rounded-b-[35px]">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg"><i class="fas fa-play text-white text-sm"></i></div>
                <h1 class="text-xl font-black tracking-tighter uppercase italic">Cine<span class="text-indigo-400">Max</span> Pro</h1>
            </div>
            <button onclick="toggleSearch()" class="w-10 h-10 rounded-full glass flex items-center justify-center">
                <i class="fas fa-search text-gray-300"></i>
            </button>
        </div>
    </header>

    <div class="mt-28 px-6">
        <div id="search-box" class="hidden mb-6">
            <input type="text" id="search-input" onkeyup="handleSearch(event)" placeholder="Search Hindi Movies or Anime..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-5 px-6 text-sm focus:outline-none focus:border-indigo-500 text-white">
        </div>

        <div class="flex gap-3 overflow-x-auto no-scrollbar mb-8">
            <button onclick="fetchData('trending', this)" class="px-6 py-3 rounded-xl glass text-[10px] font-black uppercase whitespace-nowrap active-tab">Trending</button>
            <button onclick="fetchData('anime', this)" class="px-6 py-3 rounded-xl glass text-[10px] font-black uppercase whitespace-nowrap">Anime</button>
        </div>

        <div id="grid-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6"></div>
    </div>

    <div id="detail-modal" class="fixed inset-0 z-[1001] hidden bg-black/95 backdrop-blur-2xl overflow-y-auto">
        <div class="min-h-screen flex flex-col">
            <div class="relative w-full aspect-[9/12]">
                <img id="d-poster" src="" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                <button onclick="closeDetail()" class="absolute top-8 left-6 w-12 h-12 rounded-full glass flex items-center justify-center text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-8 -mt-20 relative z-10 bg-[#020617] flex-grow">
                <h2 id="d-title" class="text-3xl font-black uppercase mb-4 italic">Movie Name</h2>
                <p id="d-desc" class="text-sm text-gray-400 mb-8 line-clamp-4">Description...</p>
                <button id="play-btn" class="w-full bg-white text-black py-5 rounded-2xl font-black uppercase shadow-xl active:scale-95 transition">Watch Now</button>
            </div>
        </div>
    </div>

    <div id="player-modal" class="fixed inset-0 z-[2000] hidden bg-black flex flex-col">
        <div class="p-4 flex items-center justify-between glass border-none">
            <button onclick="closePlayer()" class="w-10 h-10 rounded-xl glass flex items-center justify-center text-white"><i class="fas fa-chevron-left"></i></button>
            <h4 id="p-name" class="text-[9px] font-black uppercase truncate text-indigo-400 italic">Streaming</h4>
            <button onclick="refreshStream()" class="w-10 h-10 rounded-xl glass flex items-center justify-center text-white"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div class="flex-grow bg-black">
            <iframe id="v-frame" src="" class="w-full h-full" allowfullscreen></iframe>
        </div>
        <div class="p-4 flex gap-3">
            <button onclick="switchServer(1)" class="flex-1 py-4 rounded-xl glass text-[9px] font-bold text-gray-400 uppercase">Server 1 (Fast)</button>
            <button onclick="switchServer(2)" class="flex-1 py-4 rounded-xl bg-indigo-600 text-[9px] font-bold text-white uppercase shadow-lg">Server 2 (Hindi)</button>
        </div>
    </div>

    <script>
        const API_KEY = '58ecb62e3501a9362b07436c507aafd8';
        const IMG = 'https://image.tmdb.org/t/p/w500';
        let currentItem = null;
        let autoSwitchTimer;

        window.onload = () => fetchData('trending');

        async function fetchData(mode, btn) {
            if(btn) updateActiveTab(btn);
            let url = `https://api.themoviedb.org/3/trending/all/day?api_key=${API_KEY}&language=hi-IN`;
            if(mode === 'anime') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&language=hi-IN&sort_by=popularity.desc`;
            
            const res = await fetch(url);
            const data = await res.json();
            renderGrid(data.results);
        }

        function renderGrid(items) {
            const container = document.getElementById('grid-container');
            container.innerHTML = items.filter(m => m.poster_path).map(m => `
                <div class="movie-card glass rounded-[25px] p-2" onclick='showDetail(${JSON.stringify(m).replace(/'/g, "&apos;")})'>
                    <img src="${IMG + m.poster_path}" class="w-full aspect-[2/3] object-cover rounded-[18px]">
                    <h4 class="text-[9px] font-black truncate uppercase text-center mt-2 italic">${m.title || m.name}</h4>
                </div>
            `).join('');
        }

        function showDetail(m) {
            currentItem = m;
            document.getElementById('d-title').innerText = m.title || m.name;
            document.getElementById('d-desc').innerText = m.overview || "Hindi Dubbed content details updating...";
            document.getElementById('d-poster').src = IMG + (m.backdrop_path || m.poster_path);
            document.getElementById('detail-modal').classList.remove('hidden');

            const type = (m.title || m.media_type === 'movie') ? 'movie' : 'tv';
            document.getElementById('play-btn').onclick = () => openPlayer(m.id, type, m.title || m.name);
        }

        function openPlayer(id, type, name) {
            document.getElementById('p-name').innerText = name;
            const frame = document.getElementById('v-frame');
            
            // Hindi Priority Server
            frame.src = `https://vidsrc.me/embed/${type}?tmdb=${id}&lang=hi`; 
            document.getElementById('player-modal').classList.remove('hidden');
            document.getElementById('detail-modal').classList.add('hidden');
            
            showToast("Opening Hindi Server... Set Audio in Player Settings");

            clearTimeout(autoSwitchTimer);
            autoSwitchTimer = setTimeout(() => {
                if (frame.src.includes("vidsrc.me")) {
                    showToast("Primary Server Slow. Using Backup Server 1...");
                    switchServer(1);
                }
            }, 8500);
        }

        function switchServer(s) {
            const type = (currentItem.title || currentItem.media_type === 'movie') ? 'movie' : 'tv';
            const id = currentItem.id;
            const frame = document.getElementById('v-frame');
            clearTimeout(autoSwitchTimer);

            if(s === 1) frame.src = `https://vidsrc.to/embed/${type}/${id}`;
            else frame.src = `https://vidsrc.me/embed/${type}?tmdb=${id}&lang=hi`;
            showToast("Switched Server Successfully");
        }

        function closePlayer() {
            document.getElementById('player-modal').classList.add('hidden');
            document.getElementById('v-frame').src = '';
            document.getElementById('detail-modal').classList.remove('hidden');
            clearTimeout(autoSwitchTimer);
        }

        function closeDetail() { document.getElementById('detail-modal').classList.add('hidden'); }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3500);
        }
        function updateActiveTab(btn) {
            document.querySelectorAll('button').forEach(b => b.classList.remove('active-tab'));
            btn.classList.add('active-tab');
        }
        function toggleSearch() { document.getElementById('search-box').classList.toggle('hidden'); }
        function refreshStream() {
            const f = document.getElementById('v-frame');
            const s = f.src; f.src = ''; 
            setTimeout(() => { f.src = s; showToast("Refreshing Stream..."); }, 100);
        }
        async function handleSearch(e) {
            if(e.key === 'Enter') {
                const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${e.target.value}&language=hi-IN`);
                const data = await res.json();
                renderGrid(data.results);
            }
        }
    </script>
</body>
</html>
