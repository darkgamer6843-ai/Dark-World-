<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax Pro | Dark World</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #020617; color: white; scroll-behavior: smooth; }
        .movie-card:hover { transform: scale(1.05); transition: 0.3s; cursor: pointer; }
        .glass { background: rgba(30, 27, 75, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        #videoPlayerContainer { display: none; position: fixed; inset: 0; z-index: 100; background: black; }
        iframe { border: none; }
    </style>
</head>
<body class="font-sans">

    <div id="videoPlayerContainer">
        <div class="absolute top-4 left-4 z-50 flex items-center gap-2 glass px-4 py-2 rounded-full cursor-pointer" onclick="closePlayer()">
            <i class="fas fa-arrow-left text-white"></i>
            <span class="text-sm font-bold">Back to Dark World</span>
        </div>
        <iframe id="videoFrame" class="w-full h-full" allowfullscreen></iframe>
    </div>

    <nav class="p-5 glass sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg shadow-lg shadow-indigo-500/50">
                <i class="fas fa-play text-white"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tighter uppercase italic text-indigo-400">CineMax Pro</h1>
        </div>
        <div class="flex gap-4 items-center">
            <i class="fas fa-search text-xl text-gray-400"></i>
            <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center text-xs font-bold">T</div>
        </div>
    </nav>

    <main class="p-4 mb-20">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-white font-bold text-xl flex items-center gap-2">
                <span class="w-2 h-6 bg-indigo-500 rounded-full"></span>
                Trending Movies & Anime
            </h2>
        </div>
        
        <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            <div class="col-span-full py-20 text-center">
                <i class="fas fa-spinner fa-spin text-4xl text-indigo-500 mb-4"></i>
                <p class="text-gray-400">Dark World लोड हो रहा है...</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 w-full glass p-4 flex justify-around items-center z-40">
        <div class="text-indigo-400 flex flex-col items-center gap-1">
            <i class="fas fa-home text-xl"></i>
            <span class="text-[10px] uppercase font-bold">Home</span>
        </div>
        <div class="text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-fire text-xl"></i>
            <span class="text-[10px] uppercase font-bold">Trending</span>
        </div>
        <div class="text-gray-400 flex flex-col items-center gap-1">
            <i class="fas fa-heart text-xl"></i>
            <span class="text-[10px] uppercase font-bold">Watchlist</span>
        </div>
    </div>

    <script>
        // आपकी TMDB API Key यहाँ लगा दी गई है
        const API_KEY = '58ecb62e3501a9362b07436c507aafd8'; 
        const movieGrid = document.getElementById('movieGrid');
        const videoPlayerContainer = document.getElementById('videoPlayerContainer');
        const videoFrame = document.getElementById('videoFrame');

        // मूवी डेटा लाने का फंक्शन
        async function fetchMovies() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${API_KEY}`);
                const data = await response.json();
                
                movieGrid.innerHTML = data.results.map(movie => `
                    <div class="movie-card bg-slate-900/50 rounded-2xl overflow-hidden border border-white/5" 
                         onclick="playMovie('${movie.media_type}', '${movie.id}')">
                        <div class="relative group">
                            <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" 
                                 class="w-full h-72 object-cover" 
                                 alt="${movie.title || movie.name}">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                                <i class="fas fa-play-circle text-5xl text-white"></i>
                            </div>
                            <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md text-[10px] px-2 py-1 rounded-md font-bold text-yellow-400">
                                ⭐ ${movie.vote_average.toFixed(1)}
                            </div>
                        </div>
                        <div class="p-3">
                            <h3 class="text-sm font-bold truncate text-gray-100">${movie.title || movie.name}</h3>
                            <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-tighter">
                                ${movie.media_type === 'movie' ? 'Movie' : 'TV Series'} • ${movie.release_date || movie.first_air_date || ''}
                            </p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                movieGrid.innerHTML = `<p class="text-red-500 col-span-full text-center">API Error! अपनी Key चेक करें।</p>`;
            }
        }

        // मूवी प्ले करने का फंक्शन (बिना डाउनलोड किए)
        function playMovie(type, id) {
            // हम vidsrc का इस्तेमाल कर रहे हैं जो फ्री में स्ट्रीम करता है
            const streamUrl = type === 'movie' 
                ? `https://vidsrc.me/embed/movie?tmdb=${id}` 
                : `https://vidsrc.me/embed/tv?tmdb=${id}&season=1&episode=1`;
            
            videoFrame.src = streamUrl;
            videoPlayerContainer.style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }

        // प्लेयर बंद करने का फंक्शन
        function closePlayer() {
            videoPlayerContainer.style.display = 'none';
            videoFrame.src = '';
            document.body.style.overflow = 'auto';
        }

        fetchMovies();
    </script>
</body>
</html>
