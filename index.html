<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax Hindi Dubbed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #020617; color: white; font-family: sans-serif; }
        .glass { background: rgba(30, 27, 75, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        #videoPlayerContainer { display: none; position: fixed; inset: 0; z-index: 1000; background: black; }
        iframe { border: none; width: 100%; height: 100%; }
        .movie-card:hover { transform: translateY(-5px); transition: 0.3s; cursor: pointer; }
    </style>
</head>
<body>

    <div id="videoPlayerContainer">
        <div class="absolute top-4 left-4 z-50 flex gap-2">
            <button onclick="closePlayer()" class="bg-red-600 px-5 py-2 rounded-full font-bold shadow-lg">
                <i class="fas fa-times mr-2"></i> बंद करें
            </button>
        </div>
        <iframe id="videoFrame" allowfullscreen></iframe>
    </div>

    <nav class="p-4 glass sticky top-0 z-50 shadow-2xl">
        <div class="max-w-6xl mx-auto flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-black italic text-indigo-400 tracking-tighter">CINEMAX HINDI</h1>
                <div class="bg-indigo-600 px-3 py-1 rounded text-[10px] font-bold uppercase">Hindi Dubbed Pro</div>
            </div>
            
            <div class="relative flex items-center">
                <input type="text" id="searchInput" placeholder="मूवी का नाम लिखें (जैसे: Marvel Hindi)..." 
                       class="w-full bg-slate-800 border border-slate-700 p-3 pl-10 rounded-xl focus:outline-none">
                <i class="fas fa-search absolute left-3 text-gray-500"></i>
                <button onclick="searchMovies()" class="ml-2 bg-indigo-600 px-6 py-3 rounded-xl font-bold">खोजें</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 mb-24">
        <h2 id="listTitle" class="text-white font-bold text-xl mb-6 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-indigo-500 rounded-full"></span> डब की गई फिल्में
        </h2>
        <div id="movieGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
    </main>

    <script>
        const API_KEY = '58ecb62e3501a9362b07436c507aafd8'; 
        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');

        async function loadInitialMovies() {
            // यहाँ हमने language=hi-IN और with_original_language=hi का उपयोग किया है
            const res = await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=hi-IN&region=IN&sort_by=popularity.desc`);
            const data = await res.json();
            displayMovies(data.results);
        }

        function displayMovies(movies) {
            movieGrid.innerHTML = movies.map(m => `
                <div class="movie-card bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-white/5" 
                     onclick="playMovie('${m.id}', '${m.title || m.name}')">
                    <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full h-72 object-cover">
                    <div class="p-3">
                        <h3 class="text-sm font-bold truncate text-gray-100">${m.title || m.name}</h3>
                        <p class="text-[10px] text-green-400 mt-1 font-bold italic uppercase">हिंदी में उपलब्ध</p>
                    </div>
                </div>
            `).join('');
        }

        async function searchMovies() {
            const query = searchInput.value;
            if(!query) return;
            // सर्च में "Hindi" शब्द अपने आप जोड़ दिया जाएगा ताकि बेहतर रिजल्ट मिले
            const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${query} Hindi&language=hi-IN`);
            const data = await res.json();
            displayMovies(data.results.filter(m => m.poster_path));
        }

        function playMovie(id) {
            // हमने vidsrc.to का उपयोग किया है जो Multi-Audio (Hindi) को बेहतर सपोर्ट करता है
            const streamUrl = `https://vidsrc.to/embed/movie/${id}`;
            document.getElementById('videoFrame').src = streamUrl;
            document.getElementById('videoPlayerContainer').style.display = 'block';
        }

        function closePlayer() {
            document.getElementById('videoPlayerContainer').style.display = 'none';
            document.getElementById('videoFrame').src = '';
            document.body.style.overflow = 'auto';
        }

        loadInitialMovies();
    </script>
</body>
</html>
